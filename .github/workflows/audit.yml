name: Audit

# Known-vulnerability checks against the committed lockfiles. ci.yml calls this on
# every push and PR (so release.yml gates on it too); the schedule catches advisories
# published after the last change. Shipped dependencies fail the run; development
# tooling (Vite, Vitest, VitePress, Pest) is reported without failing it.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  npm:
    name: npm (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm audit reads pnpm-lock.yaml; no install needed.
      - name: Production dependencies
        run: pnpm audit --prod
      - name: All dependencies (report only)
        continue-on-error: true
        run: pnpm audit

  composer:
    name: Composer (composer audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [packages/laravel, playground]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      # Abandoned packages are reported, not failed: only advisories block.
      - name: Production dependencies
        working-directory: ${{ matrix.path }}
        run: composer audit --locked --no-dev --abandoned=report
      - name: All dependencies (report only)
        working-directory: ${{ matrix.path }}
        continue-on-error: true
        run: composer audit --locked --abandoned=report
